name: EKS Infrastructure Pipeline

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main", "dev", "feature/infra-creation" ]
  pull_request:
    branches: [ "main", "dev"]
    

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  set-environment:
    runs-on: ubuntu-latest

    outputs:
      env_name: ${{ steps.set_env.outputs.env_name }}

    steps:
      - name: Set environment
        id: set_env
        run: |
          echo "STARTED: Setting environment based on branch..."

          # Detect branch name
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH="${{ github.base_ref }}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi

          # Map branch directly to environment
          if [[ "$BRANCH" == "main" ]]; then
            echo "Branch '$BRANCH' detected -> setting environment to prod"
            ENV="prod"

          elif [[ "$BRANCH" == "dev" ]]; then
            echo "Branch '$BRANCH' detected -> setting environment to dev"
            ENV="dev"
          fi

          echo "Branch": $BRANCH
          echo "env_name": $ENV >> "$GITHUB_OUTPUT"
  Terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    needs: set-environment
    environment:
      name: ${{ needs.set-environment.outputs.env_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        if: ${{ needs.set-environment.outputs.env_name == 'dev' }}
        uses: aws-actions/configure-aws-credentials@v6

        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: |
          echo "Checking AWS authentication..."
          aws sts get-caller-identity

      - name: Check AWS region
        run: |
          echo "AWS Region:"
          aws configure get region

          echo "AWS CLI version:"
          aws --version

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform version
        run: |
          terraform version

      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive


      # ---------------------------------------------------------
      # 8. Terraform initialization
      # ---------------------------------------------------------
      - name: Terraform Init
        run: |
          terraform init -input=false


      # ---------------------------------------------------------
      # 9. Terraform validation
      # ---------------------------------------------------------
      - name: Terraform Validate
        run: |
          terraform validate


      # ---------------------------------------------------------
      # 10. Terraform Plan
      # ---------------------------------------------------------
      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file="env/dev.tfvars" \
            -out=tfplan


      # ---------------------------------------------------------
      # 11. Terraform Apply
      # ---------------------------------------------------------
      - name: Terraform Apply
        run: |
          terraform apply \
            -auto-approve \
            tfplan


      # ---------------------------------------------------------
      # 12. Display Terraform outputs
      # ---------------------------------------------------------
      - name: Terraform Outputs
        run: |
          terraform output


      # ---------------------------------------------------------
      # 13. Verify EKS cluster
      # ---------------------------------------------------------
      - name: Verify EKS cluster
        run: |
          aws eks describe-cluster \
            --name dev-sdds-eks \
            --region $AWS_REGION \
            --query 'cluster.status' \
            --output text


      # ---------------------------------------------------------
      # 14. Configure kubectl
      # ---------------------------------------------------------
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name dev-sdds-eks


      # ---------------------------------------------------------
      # 15. Verify Kubernetes cluster
      # ---------------------------------------------------------
      - name: Verify Kubernetes nodes
        run: |
          kubectl get nodes -o wide


      # ---------------------------------------------------------
      # 16. Verify Kubernetes system pods
      # ---------------------------------------------------------
      - name: Verify Kubernetes system pods
        run: |
          kubectl get pods -A


      # ---------------------------------------------------------
      # 17. Final verification
      # ---------------------------------------------------------
      - name: EKS deployment summary
        run: |
          echo "=========================================="
          echo " EKS INFRASTRUCTURE CREATED SUCCESSFULLY"
          echo "=========================================="
          echo ""
          echo "Cluster:"
          echo "dev-sdds-eks"
          echo ""
          echo "Region:"
          echo "$AWS_REGION"
          echo ""
          echo "Nodes:"
          kubectl get nodes
          echo ""
          echo "Cluster Status:"
          aws eks describe-cluster \
            --name dev-sdds-eks \
            --region $AWS_REGION \
            --query 'cluster.status' \
            --output text